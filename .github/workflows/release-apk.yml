name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      qa_verified_commit:
        description: 'Commit SHA that has passed QA (must match HEAD)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify commit SHA matches
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)
          INPUT_SHA="${{ github.event.inputs.qa_verified_commit }}"
          echo "Current HEAD: $CURRENT_SHA"
          echo "Input QA SHA: $INPUT_SHA"
          if [ "$CURRENT_SHA" != "$INPUT_SHA" ]; then
            echo "ERROR: Commit SHA mismatch!"
            echo "The workflow_dispatch must be run from the exact commit that passed QA."
            echo "Expected: $INPUT_SHA"
            echo "Actual:   $CURRENT_SHA"
            exit 1
          fi
          echo "✅ Commit SHA verified: $CURRENT_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run QA Gate - Clean
        run: ./gradlew clean --no-daemon

      - name: Run QA Gate - Compile
        run: ./gradlew compileDebugKotlin --no-daemon --stacktrace

      - name: Run QA Gate - Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run QA Gate - Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Run QA Gate - Assemble Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run QA Gate - Assemble Android Test APK
        run: ./gradlew assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Get version from build.gradle
        id: get_version
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle.kts 2>/dev/null || grep -oP "versionName = \"[^\"]+\"" app/build.gradle.kts | grep -oP '\"\K[^\"]+' || echo "1.0")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get version code
        id: get_version_code
        run: |
          VERSION_CODE=$(grep -oP 'versionCode\s*[=:]?\s*\K\d+' app/build.gradle.kts | head -1 || echo "1")
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Get short SHA
        id: get_sha
        run: |
          echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Calculate APK SHA-256
        id: get_apk_hash
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            HASH=$(sha256sum "$APK_PATH" | awk '{print $1}')
            SIZE=$(stat -c%s "$APK_PATH")
            echo "APK_HASH=$HASH" >> $GITHUB_ENV
            echo "APK_SIZE=$SIZE" >> $GITHUB_ENV
            echo "apk_hash=$HASH" >> $GITHUB_OUTPUT
            echo "apk_size=$SIZE" >> $GITHUB_OUTPUT
            echo "✅ APK SHA-256: $HASH"
            echo "✅ APK Size: $SIZE bytes"
          else
            echo "ERROR: APK not found at $APK_PATH"
            exit 1
          fi

      - name: Create release directory
        run: mkdir -p release

      - name: Copy APK with versioned name
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "release/BudgetShield-v${{ steps.get_version.outputs.version }}-${{ steps.get_sha.outputs.sha }}-debug.apk"

      - name: Generate release notes
        run: |
          cat > release/notes.md << 'EOF'
          # Budget Shield Beta Release
          
          **Version:** ${{ steps.get_version.outputs.version }}
          **Version Code:** ${{ steps.get_version_code.outputs.version_code }}
          **Commit:** ${{ steps.get_sha.outputs.sha }}
          **APK SHA-256:** ${{ steps.get_apk_hash.outputs.apk_hash }}
          **APK Size:** ${{ steps.get_apk_hash.outputs.apk_size }} bytes
          **Date:** $(date -u +%Y-%m-%d %H:%M UTC)
          
          ## QA Verification
          
          All QA gates passed for commit `${{ steps.get_sha.outputs.sha }}`:
          - ✅ Clean build
          - ✅ Compile
          - ✅ Unit tests
          - ✅ Lint
          - ✅ Debug APK assembly
          - ✅ Android test APK assembly
          
          ## Recent Changes
          
          EOF
          git log --oneline -10 >> release/notes.md
          
          cat >> release/notes.md << 'EOF'
          
          ## Installation
          
          This is a **debug beta build**, not a signed release APK.
          
          1. Download `BudgetShield-v${{ steps.get_version.outputs.version }}-${{ steps.get_sha.outputs.sha }}-debug.apk`
          2. Enable "Install from unknown sources" on your Android device
          3. Install the APK
          
          ## Known Limitations
          
          - This is a debug build with debug signing
          - No release signing keystore exists yet
          - Release signing is the remaining blocker for production release
          
          EOF

      - name: Upload QA reports as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-${{ steps.get_sha.outputs.sha }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/test-results/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}-${{ steps.get_sha.outputs.sha }}
          name: Budget Shield v${{ steps.get_version.outputs.version }} (${{ steps.get_sha.outputs.sha }}) - Debug Beta
          body_path: release/notes.md
          files: |
            release/*.apk
          prerelease: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release created
        run: |
          echo "✅ Release v${{ steps.get_version.outputs.version }}-${{ steps.get_sha.outputs.sha }} created"
          echo "✅ APK SHA-256: ${{ steps.get_apk_hash.outputs.apk_hash }}"
