name: Build and Release APK

on:
  workflow_dispatch:

jobs:
  qa-gate-check:
    runs-on: ubuntu-latest
    steps:
      - name: Require manual QA verification
        run: |
          echo "This workflow requires manual QA gate completion."
          echo "Run qa-gate.yml first and verify all tests pass before release."

  build-release:
    runs-on: ubuntu-latest
    needs: qa-gate-check
    permissions:
      contents: write

    steps:

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get version from build.gradle
        id: get_version
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle.kts || echo "1.0")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get short SHA
        id: get_sha
        run: |
          echo "SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK with version
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/BudgetShield-v${{ steps.get_version.outputs.version }}-${{ steps.get_sha.outputs.sha }}.apk"

      - name: Generate release notes
        run: |
          echo "# Budget Shield v${{ steps.get_version.outputs.version }}" > release/notes.md
          echo "" >> release/notes.md
          echo "Build: ${{ steps.get_sha.outputs.sha }}" >> release/notes.md
          echo "Date: $(date -u +%Y-%m-%d)" >> release/notes.md
          echo "" >> release/notes.md
          echo "## Latest Changes" >> release/notes.md
          echo "" >> release/notes.md
          git log --oneline -10 >> release/notes.md

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}-${{ steps.get_sha.outputs.sha }}
          name: Budget Shield v${{ steps.get_version.outputs.version }} (${{ steps.get_sha.outputs.sha }})
          body_path: release/notes.md
          files: |
            release/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Beta Build
          body: |
            Latest debug build from main branch.
            
            Version: ${{ steps.get_version.outputs.version }}
            Commit: ${{ steps.get_sha.outputs.sha }}
            Date: $(date -u +%Y-%m-%d)
          files: |
            release/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
